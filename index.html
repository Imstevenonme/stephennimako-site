<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Stephen Nimako Jr — IT Infrastructure &amp; Support Engineering</title>
    <meta name="description" content="Stephen Nimako Jr — IT Support Engineer & infrastructure specialist in Austin, TX. AWS Solutions Architect Professional, Cisco CCNA. Building toward infrastructure engineering with a security focus." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Allura&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f5f1;
        --bg-2: #efede7;
        --surface: #ffffff;
        --surface-2: #faf9f6;
        --ink: #14161a;
        --ink-2: #454b54;
        --ink-3: #6d747e;
        --line: #e0ddd3;
        --line-strong: #c9c5b8;
        --accent: #9a6206;
        --accent-bright: #b97a0d;
        --accent-soft: #f3e3c8;
        --chip: #efece4;
        --hero-ink: #f4f1ea;
        --hero-ink-2: #c9cdd4;
        --shadow: 0 10px 30px rgba(20, 22, 26, 0.08);
        --radius: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0c10;
          --bg-2: #0e1116;
          --surface: #12151c;
          --surface-2: #161a22;
          --ink: #eef0f3;
          --ink-2: #b7bdc7;
          --ink-3: #7e8694;
          --line: #232833;
          --line-strong: #333b4a;
          --accent: #f0b64c;
          --accent-bright: #ffc95e;
          --accent-soft: #2a2113;
          --chip: #1b2029;
          --shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
        }
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 16.5px;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }
      h1, h2, h3 { font-family: "Sora", system-ui, sans-serif; line-height: 1.15; margin: 0; }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
      .wrap { max-width: 1080px; margin: 0 auto; padding: 0 22px; }

      /* ---------- nav ---------- */
      .nav {
        position: sticky; top: 0; z-index: 50;
        background: color-mix(in srgb, var(--bg) 86%, transparent);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      .nav-inner { display: flex; align-items: center; gap: 18px; height: 58px; }
      .brand { display: flex; align-items: center; gap: 10px; color: var(--ink); font-family: "Sora", sans-serif; font-weight: 700; letter-spacing: 0.02em; flex: none; }
      .brand:hover { text-decoration: none; }
      .brand-sig {
        font-family: "Allura", cursive; font-size: 34px; line-height: 1;
        color: var(--accent); padding: 0 6px 0 2px; transform: rotate(-5deg);
        display: inline-block; flex: none; user-select: none;
      }
      .brand:hover .brand-sig { text-decoration: none; }
      .monogram {
        width: 34px; height: 34px; flex: none;
        display: grid; place-items: center;
        border: 1.5px solid var(--accent); border-radius: 9px;
        color: var(--accent); font-family: "Sora", sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.04em;
        background: var(--accent-soft);
      }
      .nav-links { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
      .nav-links a {
        color: var(--ink-2); font-size: 13.5px; font-weight: 600; padding: 7px 11px; border-radius: 8px; white-space: nowrap;
      }
      .nav-links a:hover { color: var(--ink); text-decoration: none; background: var(--chip); }
      .nav-links a.active { color: var(--accent); background: var(--accent-soft); }
      @media (max-width: 640px) {
        .brand .brand-name { display: none; }
        .nav-inner { height: auto; min-height: 58px; padding-top: 8px; padding-bottom: 8px; flex-wrap: wrap; }
        .nav-links a { padding: 6px 8px; font-size: 13px; }
      }

      /* ---------- hero ---------- */
      .hero {
        position: relative; overflow: hidden;
        background: #07080b; color: var(--hero-ink);
        border-bottom: 1px solid #232833;
      }
      .hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.55; }
      .hero-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,8,11,0.55) 0%, rgba(7,8,11,0.72) 55%, rgba(7,8,11,0.94) 100%); }
      .hero-inner { position: relative; padding-top: 74px; padding-bottom: 64px; }
      .hero .monogram { width: 58px; height: 58px; font-size: 21px; border-radius: 14px; border-color: #f0b64c; color: #f0b64c; background: rgba(240,182,76,0.10); }
      .hero-photo { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 3px solid #f0b64c; box-shadow: 0 10px 28px rgba(0,0,0,0.45); display: block; cursor: pointer; transition: transform 0.15s ease; }
      .hero-photo:hover { transform: scale(1.03); }
      .hero-photo:focus-visible { outline: 3px solid #f0b64c; outline-offset: 3px; }
      .hero h1 { font-size: clamp(40px, 6.5vw, 64px); font-weight: 800; letter-spacing: -0.01em; margin-top: 22px; color: #ffffff; }
      .hero h1 .jr { color: #f0b64c; }
      .role-line { font-family: "IBM Plex Mono", monospace; font-size: clamp(15px, 2.6vw, 19px); color: var(--hero-ink-2); margin-top: 14px; min-height: 1.6em; }
      .role-line .typed { color: #f0b64c; }
      .caret { display: inline-block; width: 9px; height: 1.05em; background: #f0b64c; vertical-align: text-bottom; margin-left: 3px; animation: blink 1.05s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .hero-sub { max-width: 640px; color: var(--hero-ink-2); font-size: 17.5px; margin: 18px 0 0; }
      .hero-sub strong { color: #ffffff; font-weight: 700; }
      .hero-ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
      .btn {
        display: inline-flex; align-items: center; gap: 9px;
        font-weight: 700; font-size: 14.5px; padding: 11px 20px; border-radius: 10px;
        border: 1px solid transparent; cursor: pointer; transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      }
      .btn:hover { text-decoration: none; transform: translateY(-1px); }
      .btn-solid { background: #f0b64c; color: #191104; }
      .btn-solid:hover { background: #ffc95e; }
      .btn-ghost { background: rgba(255,255,255,0.06); color: #f4f1ea; border-color: rgba(255,255,255,0.28); }
      .btn-ghost:hover { background: rgba(255,255,255,0.12); }
      .btn svg { width: 16px; height: 16px; flex: none; }
      .hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 46px; }
      .stat {
        border: 1px solid rgba(255,255,255,0.14); border-radius: var(--radius);
        background: rgba(255,255,255,0.045); padding: 16px 18px;
      }
      .stat .num { font-family: "Sora", sans-serif; font-size: 30px; font-weight: 800; color: #ffffff; line-height: 1.1; }
      .stat .num em { font-style: normal; color: #f0b64c; }
      .stat .lbl { font-size: 12.5px; color: var(--hero-ink-2); margin-top: 4px; line-height: 1.45; }
      @media (max-width: 720px) { .hero-stats { grid-template-columns: repeat(2, 1fr); } .hero-inner { padding-top: 54px; padding-bottom: 48px; } }

      /* ---------- photo lightbox ---------- */
      .photo-lightbox { position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center; background: rgba(4,5,8,0.88); padding: 20px; }
      .photo-lightbox.open { display: flex; }
      .photo-lightbox img { width: min(78vw, 400px); height: min(78vw, 400px); max-width: 400px; max-height: 400px; border-radius: 50%; object-fit: cover; border: 4px solid #f0b64c; box-shadow: 0 24px 60px rgba(0,0,0,0.6); }
      .photo-lightbox .lb-close { position: absolute; top: 18px; right: 18px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.08); color: #ffffff; font-size: 24px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
      .photo-lightbox .lb-close:hover { background: rgba(255,255,255,0.16); }

      /* ---------- sections ---------- */
      section { padding: 68px 0 8px; }
      .sec-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 8px; }
      .sec-head .sec-ico { width: 30px; height: 30px; flex: none; align-self: center; display: grid; place-items: center; border-radius: 8px; background: var(--accent-soft); color: var(--accent); }
      .sec-head .sec-ico svg { width: 17px; height: 17px; }
      .sec-head h2 { font-size: clamp(26px, 4vw, 34px); font-weight: 800; letter-spacing: -0.01em; }
      .sec-head .sec-note { margin-left: auto; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-3); text-align: right; }
      .sec-sub { color: var(--ink-2); max-width: 680px; margin: 6px 0 26px; }
      .reveal { }
      .reveal.in { }

      .about-grid { display: grid; grid-template-columns: 1fr 1.7fr; gap: 26px; align-items: start; }
      @media (max-width: 820px) { .about-grid { grid-template-columns: 1fr; } }
      .about-copy p { margin: 0 0 14px; color: var(--ink-2); }
      .about-copy p strong { color: var(--ink); }
      .fact-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow); }
      .fact-card h3 { font-size: 13px; font-family: "IBM Plex Mono", monospace; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
      .fact-card dl { margin: 0; display: grid; gap: 10px; }
      .fact-card .row { display: flex; justify-content: space-between; gap: 14px; font-size: 14px; border-bottom: 1px dashed var(--line); padding-bottom: 8px; }
      .fact-card .row:last-child { border-bottom: 0; padding-bottom: 0; }
      .fact-card dt { color: var(--ink-3); flex: none; }
      .fact-card dd { margin: 0; font-weight: 600; text-align: right; }

      /* ---------- visual polish pass ---------- */
      .tag { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--chip); color: var(--ink-2); border: 1px solid var(--line); }
      .tag.hot { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 700; }

      /* experience timeline */
      .timeline { position: relative; margin: 26px 0 0; padding-left: 26px; }
      .timeline::before { content: ""; position: absolute; left: 8px; top: 10px; bottom: 10px; width: 2px; background: var(--line-strong); border-radius: 2px; }
      .job { position: relative; margin: 0 0 22px; }
      .job-dot { position: absolute; left: -24px; top: 28px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 3px solid var(--line-strong); }
      .job.current .job-dot { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
      .job-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow); }
      .job-top h3 { font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .badge-now { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 3px 9px; border-radius: 999px; }
      .job-org { display: block; color: var(--accent); font-weight: 700; font-size: 14.5px; margin-top: 3px; }
      .job-meta { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; color: var(--ink-3); margin-top: 6px; line-height: 1.6; }
      .job-card ul { margin: 14px 0 0; padding-left: 20px; color: var(--ink-2); font-size: 15px; }
      .job-card li { margin: 0 0 8px; }
      .job-card li strong { color: var(--ink); }
      .job-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
      .more-btn { margin-top: 12px; background: none; border: 1px solid var(--line-strong); color: var(--ink-2); font: 600 13px "Manrope", sans-serif; padding: 7px 14px; border-radius: 8px; cursor: pointer; }
      .more-btn:hover { border-color: var(--accent); color: var(--accent); }
      .more-wrap[hidden] { display: none; }

      /* skills */
      .skill-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 4px 0 20px; }
      .tools-label { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-3); }
      .filter-btn { font: 600 13px "Manrope", sans-serif; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; }
      .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
      .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #191104; }
      .skill-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 6px; }
      @media (max-width: 900px) { .skill-grid { grid-template-columns: repeat(2, 1fr); } }
      @media (max-width: 600px) { .skill-grid { grid-template-columns: 1fr; } }
      .skill-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); transition: opacity 0.2s ease; }
      .skill-card.dim { opacity: 0.25; }
      .skill-card h3 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
      .skill-ico { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 9px; background: var(--accent-soft); color: var(--accent); }
      .skill-ico svg { width: 18px; height: 18px; }
      .skill-blurb { font-size: 13.5px; color: var(--ink-3); margin: 0 0 12px; }
      .pills { display: flex; flex-wrap: wrap; gap: 7px; }
      .pill { font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--chip); color: var(--ink-2); border: 1px solid var(--line); }
      .pill.core { background: var(--accent); border-color: var(--accent); color: #191104; font-weight: 700; }

      /* certifications */
      .cert-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 26px; }
      @media (max-width: 700px) { .cert-grid { grid-template-columns: 1fr; } }
      .cert-card { display: flex; gap: 18px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
      .cert-badge { width: 64px; height: 64px; flex: none; display: grid; place-items: center; border-radius: 16px; font-family: "Sora", sans-serif; font-weight: 800; font-size: 19px; color: #f4f1ea; background: linear-gradient(135deg, #2a2f3a, #12151c); border: 1px solid var(--line-strong); }
      .cert-badge.amber { color: #191104; background: linear-gradient(135deg, #ffc95e, #f0b64c); border-color: transparent; }
      .cert-card h3 { font-size: 17px; font-weight: 700; }
      .cert-issuer { font-size: 13.5px; color: var(--accent); font-weight: 700; margin-top: 2px; }
      .cert-meta { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-3); margin-top: 8px; line-height: 1.6; }
      .cert-cred { font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }
      .cert-cred .mono { font-size: 12px; color: var(--ink); }

      /* education */
      .edu-card { display: flex; gap: 18px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); margin-top: 26px; }
      .edu-mark { width: 64px; height: 64px; flex: none; display: grid; place-items: center; border-radius: 16px; background: var(--accent-soft); color: var(--accent); font-family: "Sora", sans-serif; font-weight: 800; font-size: 20px; }
      .edu-card h3 { font-size: 18px; }
      .edu-school { color: var(--ink-2); font-weight: 600; font-size: 14.5px; margin-top: 2px; }
      .edu-card p { color: var(--ink-2); font-size: 14.5px; margin: 10px 0 0; }
      .edu-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

      /* dojo */
      .dojo-banner { display: flex; gap: 20px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow); margin-top: 26px; }
      .dojo-banner img { width: 110px; height: 110px; object-fit: cover; border-radius: 12px; flex: none; }
      .dojo-banner h3 { font-size: 18px; }
      .dojo-banner p { color: var(--ink-2); font-size: 14px; margin: 6px 0 0; }
      .loop-steps { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
      .loop-step { font-family: "IBM Plex Mono", monospace; font-size: 12px; background: var(--chip); border: 1px solid var(--line); padding: 4px 10px; border-radius: 999px; color: var(--ink-2); }
      .loop-arrow { color: var(--accent); font-weight: 700; }
      .track-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 18px; }
      @media (max-width: 900px) { .track-grid { grid-template-columns: repeat(2, 1fr); } }
      @media (max-width: 600px) { .track-grid { grid-template-columns: 1fr; } }
      .track-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
      .track-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .track-top h3 { font-size: 15.5px; }
      .status { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; background: var(--chip); color: var(--ink-3); border: 1px solid var(--line); white-space: nowrap; }
      .status.active { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
      .track-card p { font-size: 13px; color: var(--ink-3); margin: 8px 0 12px; }
      .bar { height: 8px; border-radius: 99px; background: var(--chip); overflow: hidden; }
      .bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--accent-bright), var(--accent)); transition: width 1s ease; }
      .log-list { display: grid; gap: 14px; margin-top: 18px; }
      .log-entry { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
      .log-entry-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
      .log-entry-top h3 { font-size: 15.5px; }
      .log-date { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
      .log-entry p { font-size: 14px; color: var(--ink-2); margin: 8px 0 0; }
      .log-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
      .log-link { display: inline-block; margin-top: 10px; font-weight: 700; font-size: 13.5px; }
      .log-empty { margin-top: 18px; color: var(--ink-3); font-size: 14px; }

      /* path */
      .path-list { position: relative; margin: 26px 0 0; padding-left: 26px; }
      .path-list::before { content: ""; position: absolute; left: 8px; top: 10px; bottom: 10px; width: 2px; background: var(--line-strong); border-radius: 2px; }
      .phase { position: relative; margin: 0 0 20px; }
      .phase-dot { position: absolute; left: -24px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 3px solid var(--accent); }
      .phase-when { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--accent); font-weight: 600; letter-spacing: 0.04em; }
      .phase-title { font-family: "Sora", sans-serif; font-weight: 700; font-size: 16px; color: var(--ink); margin-left: 8px; }
      .phase p { color: var(--ink-2); font-size: 14.5px; margin: 6px 0 0; max-width: 640px; }
      .phase .edu-meta { margin-top: 10px; }

      /* contact */
      .contact-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 34px 28px; box-shadow: var(--shadow); margin-top: 26px; text-align: center; }
      .contact-card h3 { font-size: 22px; }
      .contact-card > p { color: var(--ink-2); max-width: 560px; margin: 10px auto 0; }
      .contact-links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 22px; }
      .btn-dark { background: var(--ink); color: var(--bg); }
      .btn-dark:hover { opacity: 0.88; }
      .btn-line { background: transparent; color: var(--ink); border-color: var(--line-strong); }
      .btn-line:hover { border-color: var(--accent); color: var(--accent); }
      .copied-note { margin-top: 14px; font-size: 13px; color: var(--accent); min-height: 1.4em; }
</style>
  </head>
  <body>
<nav class="nav" aria-label="Primary">
      <div class="wrap nav-inner">
        <a class="brand" href="#top"><span class="brand-sig" aria-hidden="true">SN</span><span class="brand-name">Stephen Nimako Jr</span></a>
        <div class="nav-links" id="navLinks">
          <a href="#about">About</a>
          <a href="#experience">Experience</a>
          <a href="#skills">Skills</a>

  /* ---- safe DOM helpers: JSON text only ever enters via textContent ---- */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function rich(parent, str) {
    if (str === undefined || str === null) return;
    var parts = String(str).split(/\*\*(.+?)\*\*/g);
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 1) { var s = el("strong"); s.textContent = parts[i]; parent.appendChild(s); }
      else if (parts[i]) parent.appendChild(document.createTextNode(parts[i]));
    }
  }
  function svgIcon(str) {
    var t = document.createElement("template");
    t.innerHTML = str;
    return t.content.firstChild;
  }
  function safeHref(href) {
    if (typeof href !== "string") return "#";
    if (/^(https?:\/\/|mailto:|#)/i.test(href)) return href;
    if (/^[\w.\/-]+\.pdf$/i.test(href) && href.indexOf("..") === -1) return href;
    return "#";
  }
  function secHead(id, meta) {
    var head = el("div", "sec-head reveal");
    var ico = el("span", "sec-ico");
    ico.appendChild(svgIcon(SEC_ICONS[id]));
    head.appendChild(ico);
    head.appendChild(el("h2", null, meta.heading));
    if (meta.note) head.appendChild(el("span", "sec-note", meta.note));
    return head;
  }
  function secSub(text) {
    var p = el("p", "sec-sub reveal");
    rich(p, text);
    return p;
  }

  function renderHero(h) {
    var root = document.getElementById("heroInner");
    if (!root || !h) return;
    var photo = document.createElement("img");
    photo.className = "hero-photo";
    photo.src = "profile.jpg";
    photo.alt = "Stephen Nimako Jr";
    photo.onerror = function() {
      var fallback = el("span", "monogram", "SN");
      fallback.setAttribute("aria-hidden", "true");
      photo.replaceWith(fallback);
    };
    root.appendChild(photo);
    photo.title = "Tap to enlarge";
    photo.setAttribute("role", "button");
    photo.setAttribute("tabindex", "0");
    photo.setAttribute("aria-label", "Enlarge photo of Stephen Nimako Jr");
    var lb = el("div", "photo-lightbox");
    lb.setAttribute("role", "dialog");
    lb.setAttribute("aria-modal", "true");
    lb.setAttribute("aria-label", "Stephen Nimako Jr photo preview");
    var lbImg = document.createElement("img");
    lbImg.src = "profile.jpg";
    lbImg.alt = "Stephen Nimako Jr";
    var lbClose = el("button", "lb-close", "\u00d7");
    lbClose.setAttribute("aria-label", "Close photo preview");
    lb.appendChild(lbImg);
    lb.appendChild(lbClose);
    document.body.appendChild(lb);
    function openLb() { lb.classList.add("open"); }
    function closeLb() { lb.classList.remove("open"); }
    photo.addEventListener("click", openLb);
    photo.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); openLb(); } });
    lb.addEventListener("click", closeLb);
    document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") closeLb(); });
    var h1 = el("h1");
    var nm = String(h.name || "");
    if (/ Jr$/.test(nm)) {
      h1.appendChild(document.createTextNode(nm.replace(/ Jr$/, "") + " "));
      h1.appendChild(el("span", "jr", "Jr"));
    } else { h1.textContent = nm; }
    root.appendChild(h1);
    var rl = el("p", "role-line");
    rl.appendChild(document.createTextNode("> "));
    var typed = el("span", "typed", (h.roles && h.roles[0]) || h.role || "");
    typed.id = "typed";
    rl.appendChild(typed);
    var caret = el("span", "caret");
    caret.setAttribute("aria-hidden", "true");
    rl.appendChild(caret);
    root.appendChild(rl);
    var sub = el("p", "hero-sub");
    rich(sub, h.intro);
    if (h.tagline) { sub.appendChild(document.createTextNode(" ")); rich(sub, h.tagline); }
    root.appendChild(sub);
    var ctas = el("div", "hero-ctas");
    (h.ctas || []).forEach(function (c) {
      var a = el("a", "btn " + (c.style === "primary" ? "btn-solid" : "btn-ghost"));
      a.href = safeHref(c.href);
      if (c.external) { a.target = "_blank"; a.rel = "noopener"; }
      if (CTA_ICONS[c.icon]) a.appendChild(svgIcon(CTA_ICONS[c.icon]));
      a.appendChild(document.createTextNode(c.label || ""));
      ctas.appendChild(a);
    });
    root.appendChild(ctas);
    var stats = el("div", "hero-stats");
    (h.stats || []).forEach(function (s) {
      var st = el("div", "stat");
      var num = el("div", "num");
      num.appendChild(document.createTextNode(s.value || ""));
      if (s.suffix) num.appendChild(el("em", null, s.suffix));
      st.appendChild(num);
      st.appendChild(el("div", "lbl", s.label || ""));
      stats.appendChild(st);
    });
    root.appendChild(stats);
  }

  function renderAbout(a, meta) {
    var root = document.getElementById("about");
    if (!root || !a) return;
    root.appendChild(secHead("about", meta));
    var grid = el("div", "about-grid");
    var aside = el("aside", "fact-card reveal");
    aside.setAttribute("aria-label", (a.facts && a.facts.title) || "Quick facts");
    aside.appendChild(el("h3", null, (a.facts && a.facts.title) || "Quick facts"));
    var dl = el("dl");
    ((a.facts && a.facts.rows) || []).forEach(function (r) {
      var row = el("div", "row");
      row.appendChild(el("dt", null, r.label));
      row.appendChild(el("dd", null, r.value));
      dl.appendChild(row);
    });
    aside.appendChild(dl);
    grid.appendChild(aside);
    var copy = el("div", "about-copy reveal");
    (a.paragraphs || []).forEach(function (p) {
      var pe = el("p"); rich(pe, p); copy.appendChild(pe);
    });
    grid.appendChild(copy);
    root.appendChild(grid);
  }

  function renderExperience(jobs, meta) {
    var root = document.getElementById("experience");
    if (!root || !jobs) return;
    root.appendChild(secHead("experience", meta));
    if (meta.sub) root.appendChild(secSub(meta.sub));
    var tl = el("div", "timeline");
    jobs.forEach(function (j) {
      var art = el("article", "job" + (j.current ? " current" : "") + " reveal");
      art.appendChild(el("span", "job-dot"));
      var card = el("div", "job-card");
      var top = el("div", "job-top");
      var h3 = el("h3", null, j.role);
      if (j.current) h3.appendChild(el("span", "badge-now", "Current"));
      top.appendChild(h3);
      top.appendChild(el("span", "job-org", j.company));
      var jm = el("div", "job-meta");
      jm.appendChild(document.createTextNode(j.period || ""));
      jm.appendChild(document.createElement("br"));
      jm.appendChild(document.createTextNode(j.location || ""));
      top.appendChild(jm);
      card.appendChild(top);
      var bullets = j.bullets || [];
      var ul = el("ul");
      bullets.slice(0, 3).forEach(function (b) {
        var li = el("li"); rich(li, b); ul.appendChild(li);
      });
      card.appendChild(ul);
      if (bullets.length > 3) {
        var more = el("div", "more-wrap");
        more.setAttribute("hidden", "");
        var ul2 = el("ul");
        bullets.slice(3).forEach(function (b) {
          var li = el("li"); rich(li, b); ul2.appendChild(li);
        });
        more.appendChild(ul2);
        card.appendChild(more);
        var btn = el("button", "more-btn", "Show more");
        btn.type = "button";
        card.appendChild(btn);
      }
      if (j.tags && j.tags.length) {
        var tags = el("div", "job-tags");
        j.tags.forEach(function (t) {
          tags.appendChild(el("span", "tag" + (t.hot ? " hot" : ""), t.label));
        });
        card.appendChild(tags);
      }
      art.appendChild(card);
      tl.appendChild(art);
    });
    root.appendChild(tl);
  }

  function renderSkills(skills, meta) {
    var root = document.getElementById("skills");
    if (!root || !skills) return;
    root.appendChild(secHead("skills", meta));
    if (meta.sub) root.appendChild(secSub(meta.sub));
    var tools = el("div", "skill-tools reveal");
    tools.setAttribute("role", "group");
    tools.setAttribute("aria-label", "Skill group filter");
    tools.appendChild(el("span", "tools-label", "spotlight:"));
    SKILL_FILTERS.forEach(function (f, i) {
      var b = el("button", "filter-btn" + (i === 0 ? " active" : ""), f[1]);
      b.type = "button";
      b.setAttribute("data-filter", f[0]);
      tools.appendChild(b);
    });
    root.appendChild(tools);
    var grid = el("div", "skill-grid");
    skills.forEach(function (c) {
      var card = el("div", "skill-card reveal");
      card.setAttribute("data-group", c.group || "");
      var h3 = el("h3");
      if (SKILL_ICONS[c.icon]) {
        var ic = el("span", "skill-ico");
        ic.appendChild(svgIcon(SKILL_ICONS[c.icon]));
        h3.appendChild(ic);
      }
      h3.appendChild(document.createTextNode(c.category || ""));
      card.appendChild(h3);
      if (c.blurb) card.appendChild(el("p", "skill-blurb", c.blurb));
      var pills = el("div", "pills");
      (c.items || []).forEach(function (p) {
        pills.appendChild(el("span", "pill" + (p.core ? " core" : ""), p.label));
      });
      card.appendChild(pills);
      grid.appendChild(card);
    });
    root.appendChild(grid);
  }

      var bb = el("div", "banner-body");
      bb.appendChild(el("h3", null, loop.title));
      bb.appendChild(el("p", null, loop.text));
      var steps = el("div", "loop-steps");
      steps.setAttribute("aria-label", "Mastery loop steps");
      (loop.steps || []).forEach(function (s, i) {
        if (i > 0) steps.appendChild(el("span", "loop-arrow", "\u2192"));
        steps.appendChild(el("span", "loop-step", s));
      });
      bb.appendChild(steps);
      banner.appendChild(bb);
      root.appendChild(banner);
    }
    if (tracks && tracks.length) {
      var tg = el("div", "track-grid");
      tracks.forEach(function (t) {
        var card = el("div", "track-card reveal");
        var top = el("div", "track-top");
        top.appendChild(el("h3", null, t.title));
        top.appendChild(el("span", "status " + (t.statusClass || "next"), t.status));
        card.appendChild(top);
        card.appendChild(el("p", null, t.description));
        var bar = el("div", "bar");
        var fill = el("i");
        fill.setAttribute("data-bar", String(t.progress));
        bar.appendChild(fill);
        card.appendChild(bar);
        tg.appendChild(card);
      });
      root.appendChild(tg);
    }
    if (entries && entries.length) {
      var list = el("div", "log-list");
      entries.forEach(function (en) {
        var art = el("article", "log-entry reveal");
        var top = el("div", "log-entry-top");
        top.appendChild(el("h3", null, en.title));
        if (en.date) top.appendChild(el("span", "log-date", en.date));
        art.appendChild(top);
        var ps = el("p"); rich(ps, en.summary); art.appendChild(ps);
        if (en.tags && en.tags.length) {
          var tg2 = el("div", "log-tags");
          en.tags.forEach(function (t) { tg2.appendChild(el("span", "tag", t)); });
          art.appendChild(tg2);
        }
        if (en.link) {
          var a = el("a", "log-link", "Read the build log");
          a.href = safeHref(en.link);
          art.appendChild(a);
        }
        list.appendChild(art);
      });
      root.appendChild(list);
    } else if (emptyNote) {
      var le = el("div", "log-empty reveal");
      le.appendChild(el("span", "mono", "// build_log \u2014 entries: " + 0));
      rich(le, emptyNote.text);
      root.appendChild(le);
    }
  }

  function renderPath(path, meta) {
    var root = document.getElementById("path");
    if (!root || !path) return;
    root.appendChild(secHead("path", meta));
    if (meta.sub) root.appendChild(secSub(meta.sub));
    var list = el("div", "path-list");
    (path.milestones || []).forEach(function (m) {
      var ph = el("div", "phase reveal");
      ph.appendChild(el("span", "phase-dot"));
      var when = el("div", "phase-when");
      when.appendChild(document.createTextNode(m.when || ""));
      when.appendChild(el("span", "phase-title", m.title));
      ph.appendChild(when);
      var inner = el("div");
      var pd = el("p"); rich(pd, m.description); inner.appendChild(pd);
      if (m.tags && m.tags.length) {
        var em = el("div", "edu-meta");
        m.tags.forEach(function (t) {
          em.appendChild(el("span", "tag" + (t.hot ? " hot" : ""), t.label));
        });
        inner.appendChild(em);
      }
      ph.appendChild(inner);
      list.appendChild(ph);
    });
    root.appendChild(list);
  }

  function renderContact(c, meta) {
    var root = document.getElementById("contact");
    if (!root || !c) return null;
    root.appendChild(secHead("contact", meta));
    var card = el("div", "contact-card reveal");
    card.appendChild(el("h3", null, c.subheading));
    card.appendChild(el("p", null, c.text));
    var links = el("div", "contact-links");
    var li = el("a", "btn btn-dark", "LinkedIn");
    li.href = safeHref(c.linkedin); li.target = "_blank"; li.rel = "noopener";
    links.appendChild(li);
    var gh = el("a", "btn btn-line", "GitHub");
    gh.href = safeHref(c.github); gh.target = "_blank"; gh.rel = "noopener";
    links.appendChild(gh);
    var cp = el("button", "btn btn-line", "Copy my email");
    cp.type = "button"; cp.id = "copyEmail";
    links.appendChild(cp);
    var em = el("a", "btn btn-line", "Email me");
    em.href = "mailto:" + (c.email || "");
    links.appendChild(em);
    card.appendChild(links);
    var note = el("div", "copied-note");
    note.id = "copiedNote";
    note.setAttribute("role", "status");
    note.setAttribute("aria-live", "polite");
    card.appendChild(note);
    root.appendChild(card);
    return c.email || null;
  }

  function initBehaviors(roles, email) {
    /* ---- role rotator ---- */
    var typedEl = document.getElementById("typed");
    if (typedEl && roles && roles.length) {
      if (reduceMotion) {
        typedEl.textContent = roles[0];
      } else {
        var ri = 0, ci = roles[0].length, deleting = true;
        function tick() {
          var word = roles[ri];
          if (deleting) {
            ci--;
            if (ci <= 0) { deleting = false; ri = (ri + 1) % roles.length; word = roles[ri]; ci = 0; }
          } else {
            ci++;
            if (ci >= word.length) { deleting = true; setTimeout(tick, 1900); typedEl.textContent = word; return; }
          }
          typedEl.textContent = word.slice(0, ci);
          setTimeout(tick, deleting ? 26 : 52);
        }
        setTimeout(tick, 1600);
      }
    }

    /* ---- entrance motion ---- */
    if ("IntersectionObserver" in window && !reduceMotion && document.body.animate) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) {
            e.target.animate(
              [{ opacity: 0.25, transform: "translateY(12px)" }, { opacity: 1, transform: "translateY(0)" }],
              { duration: 550, easing: "ease-out" }
            );
            io.unobserve(e.target);
          }
        });
      }, { threshold: 0.1 });
      document.querySelectorAll(".reveal").forEach(function (el) { io.observe(el); });

      var bio = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) {
            e.target.style.width = e.target.getAttribute("data-bar") + "%";
            bio.unobserve(e.target);
          }
        });
      }, { threshold: 0.4 });
      document.querySelectorAll("[data-bar]").forEach(function (el) { bio.observe(el); });
    } else {
      document.querySelectorAll("[data-bar]").forEach(function (el) {
        el.style.width = el.getAttribute("data-bar") + "%";
      });
    }

    /* ---- skill spotlight filter ---- */
    var filterBtns = document.querySelectorAll(".filter-btn");
    var skillCards = document.querySelectorAll(".skill-card");
    filterBtns.forEach(function (btn) {
      btn.addEventListener("click", function () {
        filterBtns.forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        var f = btn.getAttribute("data-filter");
        skillCards.forEach(function (card) {
          var groups = (card.getAttribute("data-group") || "").split(" ");
          if (f === "all" || groups.indexOf(f) !== -1) { card.classList.remove("dim"); }
          else { card.classList.add("dim"); }
        });
      });
    });

    /* ---- experience "show more" toggles ---- */
    document.querySelectorAll(".more-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var wrap = btn.parentElement.querySelector(".more-wrap");
        if (!wrap) return;
        var collapsed = wrap.hasAttribute("hidden");
        if (collapsed) { wrap.removeAttribute("hidden"); btn.textContent = "Show less"; }
        else { wrap.setAttribute("hidden", ""); btn.textContent = "Show more"; }
      });
    });

    /* ---- nav scroll-spy ---- */
    var navLinks = document.querySelectorAll("#navLinks a");
    var sections = [];
    navLinks.forEach(function (a) {
      var id = a.getAttribute("href");
      if (id && id.charAt(0) === "#") {
        var s = document.querySelector(id);
        if (s) sections.push({ link: a, el: s });
      }
    });
    function spy() {
      var pos = window.scrollY + 120;
      var current = null;
      sections.forEach(function (s) { if (s.el.offsetTop <= pos) current = s; });
      navLinks.forEach(function (a) { a.classList.remove("active"); });
      if (current) current.link.classList.add("active");
    }
    window.addEventListener("scroll", spy, { passive: true });
    spy();

    /* ---- copy email ---- */
    var copyBtn = document.getElementById("copyEmail");
    var note = document.getElementById("copiedNote");
    if (copyBtn) {
      copyBtn.addEventListener("click", function () {
        var em = email || EMAIL_FALLBACK;
        function done() { note.textContent = "Copied: " + em; }
        function fallback() {
          var ta = document.createElement("textarea");
          ta.value = em; ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select();
          try { document.execCommand("copy"); done(); }
          catch (err) { note.textContent = em; }
          document.body.removeChild(ta);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(em).then(done, fallback);
        } else { fallback(); }
      });
    }
  }

  /* ---- load content, then render + wire behaviors ---- */
  fetch("content.json")
    .then(function (r) { if (!r.ok) throw new Error("content.json: " + r.status); return r.json(); })
    .then(function (data) {
      var meta = data.sections || {};
      renderHero(data.hero);
      renderAbout(data.about, meta.about || {});
      renderExperience(data.experience, meta.experience || {});
      renderSkills(data.skills, meta.skills || {});
      renderCerts(data.certifications, meta.certifications || {});
      renderEducation(data.education, meta.education || {});
      renderDojo(data.dojo, meta.dojo || {}, data.dojo_loop, data.dojo_tracks, data.dojo_empty);
      renderPath(data.path, meta.path || {});
      var email = renderContact(data.contact, meta.contact || {});
      initBehaviors(data.hero && data.hero.roles, email);
    })
    .catch(function () {
      /* graceful degradation: chrome (nav/footer) still works, sections stay empty */
      initBehaviors(null, null);
    });
})();
</script>
  </body>
</html>
